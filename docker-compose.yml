services:

  postgres:
    image: postgres:18.1-trixie
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    environment:
      # Timezone Settings
      - TZ=Asia/Kolkata
      - GENERIC_TIMEZONE=Asia/Kolkata
      # Database Configurations
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      # N8N Task Runners
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      # N8N Configurations
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      # Disable SSL for VPN
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-1}
    depends_on:
      - postgres

  n8n-runners:
    image: n8nio/runners
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      - n8n

  core:
    build:
      context: .
      dockerfile: dobby.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_DB_HOST=postgres
      - POSTGRES_DB_NAME=${POSTGRES_DB}
      - POSTGRES_DB_USER=${POSTGRES_DB_USER}
      - POSTGRES_DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      # Backup Config
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_GIT_REPO=${BACKUP_GIT_REPO}
      - BACKUP_GIT_BRANCH=${BACKUP_GIT_BRANCH}
      - BACKUP_GIT_ACCESS_TOKEN=${BACKUP_GIT_ACCESS_TOKEN}

volumes:
  postgres_data:
  n8n_storage:
